# lidarslam_active exploration node (docs/roadmap/active-slam-2026-11.md, P4).
# The grid, frontier and selection values are the active SLAM harness's (simulated Mid-360 on a
# ground robot, sensor about 0.5 m above the floor): adjust the height bands to your sensor.
lidarslam_active:
  ros__parameters:
    global_frame: odom
    robot_frame: base_link
    policy: frontier_info
    decision_period: 1.0
    point_stride: 1
    # Coverage grid; heights are relative to the sensor.
    grid_resolution: 0.5
    ground_max_z: -0.4
    obstacle_min_z: -0.4
    obstacle_max_z: 1.0
    max_range: 20.0
    occupied_ratio: 0.25
    clear_radius: 0.5
    inflation_radius: 0.6
    # Frontiers and goal selection (frontier information per path length).
    frontier_min_cells: 3
    gain_radius: 4.0
    min_goal_distance: 1.0
    info_weight: 1.0
    distance_weight: 0.5
    visited_radius: 1.5
    keyframe_distance: 1.0
    keyframe_angle: 0.5
    # Goal tracking.
    goal_timeout: 120.0
    stall_timeout: 20.0
    stall_distance: 0.5
    goal_change_distance: 0.5
    done_confirmations: 3
